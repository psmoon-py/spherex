name: build-packs
# Frozen for the submission: the saved images are rebuilt only when started by hand from the Actions tab,
# so an archive outage can never replace good saved images with a partial set.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  packs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q astropy numpy fsspec aiohttp matplotlib pytest astroquery
      - run: python -m pytest -q tests
      - run: python tools/build_packs.py site-data 2>&1 | tee build_log.txt
      - name: publish data branch
        run: |
          cp build_log.txt site-data/ || true
          cd site-data
          git init -q -b data
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add -A; git commit -q -m "data packs built from the SPHEREx archive"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" data
